name: Pinterest-Feeds täglich aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 06:17 Uhr Berlin (Sommerzeit), 05:17 Uhr (Winterzeit)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Website und Feeds neu bauen
        run: python3 src/gen_site.py
      - name: Änderungen an den Feeds committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feeds
          if git diff --cached --quiet; then echo "Keine fälligen Pins"; else git commit -m "Feeds: fällige Pins veröffentlicht" && git push; fi
